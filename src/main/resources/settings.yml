# ============================================
# BetterSettings - Built-in Settings Configuration
# ============================================
# Configure all built-in settings here
# Each setting can have:
#   - enabled: true/false
#   - default-state: true/false
#   - permission: permission node or null
#   - icon: Material name
#   - description: Display name (supports color codes)
#   - category: Category ID (see ui.yml)
#   - priority: Sort order (lower = first)
# ============================================
#
# LEGEND:
#   ✅ FUNCTIONAL - Works out of the box
#   🔌 PLACEHOLDER - Requires plugin integration (API-only)
#
# See SETTINGS_STATUS.md for detailed implementation status
# ============================================

