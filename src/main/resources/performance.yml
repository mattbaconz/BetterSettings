# ============================================
# BetterSettings - Performance Configuration
# ============================================
# Fine-tune performance for your server
# ============================================

# I/O Settings
io:
  # Use async I/O for all file operations (recommended: true)
  async: true
  
  # Batch save operations (saves multiple players at once)
  batch-saves: true
  
  # Maximum concurrent file operations
  # SSD: 4-8, HDD: 2-4, NVMe: 8-16
  max-concurrent: 4
  
  # Use buffered I/O (recommended: true)
  buffered: true

# Cache Settings
cache:
  # Cleanup interval in ticks (20 ticks = 1 second)
  # Set to 0 to disable automatic cleanup
  cleanup-interval: 12000
  
  # Maximum age for cached offline player data (milliseconds)
  # Default: 300000 (5 minutes)
  max-age: 300000
  
  # Initial cache capacity (number of players)
  initial-capacity: 100

# Auto-Save Settings
auto-save:
  # Auto-save interval in ticks
  # Set to 0 to disable periodic auto-save
  # Recommended: 6000 (5 minutes)
  interval: 6000
  
  # Save data when player quits
  save-on-quit: true
  
  # Load data when player joins
  load-on-join: true

# GUI Settings
gui:
  # Cache GUI items (reduces object creation)
  cache-items: true
  
  # Refresh GUI after toggling (set to false for better performance)
  refresh-on-toggle: true
  
  # Items per page (max 45 to leave room for navigation)
  # Pagination automatically activates when settings exceed this number
  items-per-page: 45
  
  # Show page numbers in GUI title
  show-page-numbers: true

# Logging Settings (affects performance if enabled)
logging:
  # Log debug information
  debug: false
  
  # Log setting registrations
  registrations: true
  
  # Log data operations (load/save)
  data-operations: false
  
  # Log setting toggles
  toggles: false
