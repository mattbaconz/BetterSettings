name: BetterSettings
version: 1.0.0
main: com.bettersettings.BetterSettings
api-version: '1.20'
folia-supported: true
author: mattbaconz
description: A centralized, API-first player settings management system

commands:
  settings:
    description: Open the player settings GUI or manage plugin
    usage: /settings [reload|info]
    aliases: [setting, prefs, preferences]
    permission: bettersettings.use

permissions:
  bettersettings.use:
    description: Allows using the /settings command
    default: true
  bettersettings.reload:
    description: Allows reloading the plugin configuration
    default: op
  bettersettings.info:
    description: Allows viewing plugin information
    default: op
  bettersettings.*:
    description: Grants all BetterSettings permissions
    default: op
    children:
      bettersettings.use: true
      bettersettings.reload: true
      bettersettings.info: true
